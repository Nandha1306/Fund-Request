name: fund-request

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundreq
      POSTGRES_USER: fundreq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fundreq}
    ports:
      - "5433:5432" # 5433 on the host so it does not clash with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundreq -d fundreq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fundreq:${POSTGRES_PASSWORD:-fundreq}@db:5432/fundreq
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      CORS_ORIGINS: '["http://localhost:3000"]'
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
  media:
